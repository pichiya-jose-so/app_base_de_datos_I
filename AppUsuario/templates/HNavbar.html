{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Plataforma de Apuestas{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'styles/CNavbar.css' %}">
</head>

<body>

    <nav class="navbar">

        <div class="navbar-logo">
            <a href="{% url 'index' %}">
                APUESTAS
            </a>
        </div>

        <div class="navbar-links">

            <a href="{% url 'index' %}">Inicio</a>

            <a href="{% url 'eventos' %}">Eventos</a>

            <a href="{% url 'apuestas' %}">Apuestas</a>

            <a href="{% url 'billetera' %}">Billetera</a>

            <a href="{% url 'saldo' %}">Saldo</a>

            <a href="{% url 'movimientos' %}">Movimientos</a>

        </div>

        <div class="navbar-user">

            <a href="{% url 'login' %}" class="btn-login">
                Iniciar sesión
            </a>

            <a href="{% url 'registro' %}" class="btn-register">
                Registrarse
            </a>

        </div>

    </nav>


    <main class="contenido">

        {% block content %}
        {% endblock %}

    </main>

</body>
</html>
